<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Notes</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-secondary: #f9fafb;
        --border: #e5e7eb;
        --text: #111827;
        --text-secondary: #6b7280;
        --text-muted: #9ca3af;
        --button-hover: #f3f4f6;
        --button-text: #374151;
        --scroll-thumb: #d1d5db;
        --accent: #111827;
        --accent-hover: #1f2937;
        --delete-hover-bg: #fee2e2;
        --delete-hover-text: #dc2626;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f2937;
          --bg-secondary: #111827;
          --border: #374151;
          --text: #f3f4f6;
          --text-secondary: #9ca3af;
          --text-muted: #6b7280;
          --button-hover: #374151;
          --button-text: #d1d5db;
          --scroll-thumb: #4b5563;
          --accent: #3b82f6;
          --accent-hover: #2563eb;
          --delete-hover-bg: #7f1d1d;
          --delete-hover-text: #fca5a5;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 500px;
        height: 600px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--bg-secondary);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 16px 20px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }

      .header h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 4px;
        color: var(--text);
      }

      .header .subtitle {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .shortcut {
        display: inline-block;
        background: var(--button-hover);
        padding: 2px 6px;
        border-radius: 3px;
        font-family: "SF Mono", monospace;
        font-size: 11px;
        color: var(--button-text);
        border: 1px solid var(--border);
      }

      .content {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
      }

      .notes-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .note-item {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .note-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }

      .note-pattern {
        font-family: "SF Mono", monospace;
        font-size: 12px;
        color: var(--button-text);
        word-break: break-all;
        flex: 1;
      }

      .note-content {
        font-size: 13px;
        color: var(--text-secondary);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 60px;
        overflow: hidden;
        line-height: 1.5;
      }

      .note-actions {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
      }

      .btn-icon {
        width: 24px;
        height: 24px;
        border: none;
        background: transparent;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        transition: all 0.15s ease;
        padding: 0;
      }

      .btn-icon:hover {
        background: var(--button-hover);
        color: var(--button-text);
      }

      .btn-icon.delete:hover {
        background: var(--delete-hover-bg);
        color: var(--delete-hover-text);
      }

      .btn-icon svg {
        width: 16px;
        height: 16px;
        stroke-width: 2;
      }

      .empty-state {
        text-align: center;
        padding: 60px 40px;
        color: var(--text-muted);
      }

      .empty-state svg {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        stroke: var(--border);
        stroke-width: 1.5;
      }

      .empty-state h2 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-secondary);
      }

      .empty-state p {
        font-size: 13px;
        line-height: 1.5;
      }

      .footer {
        padding: 12px 20px;
        background: var(--bg);
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
      }

      .btn {
        flex: 1;
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
      }

      .btn-secondary {
        background: var(--button-hover);
        color: var(--button-text);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        background: var(--border);
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn svg {
        width: 16px;
        height: 16px;
        stroke-width: 2;
      }

      .note-meta {
        font-size: 11px;
        color: var(--text-muted);
      }

      /* Scrollbar styles */
      .content::-webkit-scrollbar {
        width: 8px;
      }

      .content::-webkit-scrollbar-track {
        background: transparent;
      }

      .content::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
        border-radius: 4px;
      }

      .content::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="subtitle">
        Press <span class="shortcut">⌥⇧Y</span> to toggle notes
      </div>
    </div>

    <div class="content">
      <div class="notes-list" id="notesList">
        <!-- Notes will be inserted here -->
      </div>

      <div class="empty-state" id="emptyState" style="display: none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
          />
        </svg>
        <h2>No notes yet</h2>
        <p>
          Use the keyboard shortcut to create your first note on any webpage.
        </p>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
